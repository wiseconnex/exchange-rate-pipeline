name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-sql:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_exchange_rate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Test schema migrations
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: test_exchange_rate
        run: |
          psql -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;" && \
          psql -f "$GITHUB_WORKSPACE/sql/01-extension.sql" && \
          psql -f "$GITHUB_WORKSPACE/sql/02-schema.sql" && \
          psql -f "$GITHUB_WORKSPACE/sql/03-seed-currencies.sql" && \
          psql -f "$GITHUB_WORKSPACE/sql/04-seed-sources.sql" && \
          psql -f "$GITHUB_WORKSPACE/sql/05-seed-pairs.sql" && \
          echo "=== Tables ===" && \
          psql -c "\dt" | grep -E "currencies|currency_pairs|exchange_rate_sources|exchange_rate_snapshots" && \
          echo "=== Seed counts ===" && \
          psql -c "SELECT count(*) AS active_currencies FROM currencies WHERE is_active;" && \
          psql -c "SELECT count(*) AS active_pairs FROM currency_pairs WHERE is_active;" && \
          psql -c "SELECT count(*) AS sources FROM exchange_rate_sources;"

  validate-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install xlrd
        run: pip install xlrd==2.0.1

      - name: Syntax check
        run: |
          python3 -m py_compile scripts/backfill/frankfurter.py
          python3 -m py_compile scripts/backfill/fred.py
          python3 -m py_compile scripts/backfill/bcv_xls.py

      - name: Shell check
        run: |
          bash -n scripts/capture/capture-exchange-rate.sh
          bash -n scripts/capture/ssh_cmd.sh
          bash -n scripts/backup/backup-pg.sh
